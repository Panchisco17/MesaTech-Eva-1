spring.application.name=ms-pedidos360-catalog
server.port=8082

# Conexión a AWS RDS MySQL
spring.datasource.url=jdbc:mysql://rds-mesatech-catalogo.cprfrdj39jid.us-east-1.rds.amazonaws.com:3306/mesatech_catalog?createDatabaseIfNotExist=true
spring.datasource.username=admin
spring.datasource.password=adminmesatech
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# CONFIGURACIÓN DE RABBITMQ
spring.rabbitmq.host=172.31.28.244
spring.rabbitmq.port=5672
spring.rabbitmq.username=usr_catalogo
spring.rabbitmq.password=adminmesatech
spring.rabbitmq.virtual-host=mesatech

# Confirmaciones de publicación
spring.rabbitmq.publisher-confirm-type=correlated
spring.rabbitmq.publisher-returns=true
spring.rabbitmq.template.mandatory=true

# Recursos creados en RabbitMQ (MesaTech)
app.rabbitmq.exchange=catalogo.exchange
app.rabbitmq.routing-key=categoria.creada

# Dialecto explícito de MySQL
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect